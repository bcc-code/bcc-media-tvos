version: v1.0
name: Promote tvOS to Open beta
agent:
  machine:
    type: a2-standard-4
    os_image: macos-xcode26
blocks:
  - name: Distribute TestFlight build to Open beta
    task:
      jobs:
        - name: Distribute to Open beta group
          commands:
            - checkout
            - sem-version ruby 3.3
            - artifact pull workflow tvos_build_number
            - export BUILD_NUMBER=$(cat tvos_build_number)
            - test -n "$BUILD_NUMBER" && test "$BUILD_NUMBER" -gt 0
            - artifact pull workflow tvos_app_version
            - export APP_VERSION=$(cat tvos_app_version)
            - test -n "$APP_VERSION"
            - bundle install
            - bundle exec fastlane promote_to_open_testing
      secrets:
        - name: bccmedia-testflight-api
