version: v1.0
name: Build and deploy tvOS
agent:
  machine:
    type: a2-standard-4
    os_image: macos-xcode26
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version ruby 3.2
blocks:
  - name: Test
    dependencies: []
    task:
      jobs:
        - name: tvOS UI tests
          commands:
            - xcodebuild -downloadPlatform tvOS
            - xcrun simctl create "Apple TV" "Apple TV"
            - xcrun simctl boot "Apple TV"
            - gem install xcpretty
            - |
              set -o pipefail && xcrun xcodebuild test -workspace "BCC Media.xcworkspace" -scheme uitests -destination 'platform=tvOS Simulator,name=Apple TV,OS=latest' -derivedDataPath ./DerivedData -resultBundlePath ./DerivedData/TestResults LOGIN_API_KEY="$LOGIN_API_KEY" AUTOLOGIN_HOST="$AUTOLOGIN_HOST" RUDDER_WRITE_KEY="$RUDDER_WRITE_KEY" RUDDER_DATAPLANE_URL="$RUDDER_DATAPLANE_URL" | xcpretty
      epilogue:
        always:
          commands:
            - artifact push job DerivedData/TestResults.xcresult -d test-results || true
      secrets:
        - name: tvos-ci
  - name: Deploy to TestFlight
    dependencies:
      - Test
    run:
      when: branch = 'main'
    task:
      jobs:
        - name: Build and upload to TestFlight
          commands:
            - echo "$CERTIFICATE_P12_BASE64" | base64 -d > fastlane/certificate.p12
            - bundle install
            - bundle exec fastlane next_build_number
            - export BUILD_NUMBER=$(cat fastlane/.next_build_number)
            - test -n "$BUILD_NUMBER" && test "$BUILD_NUMBER" -gt 0
            - echo "$BUILD_NUMBER" > /tmp/tvos_build_number
            - artifact push workflow /tmp/tvos_build_number -d tvos_build_number
            - 'bundle exec fastlane beta build_number:$BUILD_NUMBER'
      secrets:
        - name: bccmedia-testflight-api
        - name: ios-signing-certs
        - name: tvos-ci
promotions:
  - name: Promote to App Store
    pipeline_file: promote-app-store.yml
