version: v1.0
name: Build and deploy tvOS
agent:
  machine:
    type: a2-standard-4
    os_image: macos-xcode26
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version ruby 3.2
blocks:
  - name: Deploy to TestFlight
    dependencies: []
    run:
      when: branch = 'main'
    task:
      jobs:
        - name: Build and upload to TestFlight
          commands:
            - echo "$CERTIFICATE_P12_BASE64" | base64 -d > fastlane/certificate.p12
            - xcodebuild -downloadPlatform tvOS
            - bundle install
            - bundle exec fastlane next_build_number
            - export BUILD_NUMBER=$(cat fastlane/.next_build_number)
            - test -n "$BUILD_NUMBER" && test "$BUILD_NUMBER" -gt 0
            - echo "$BUILD_NUMBER" > /tmp/tvos_build_number
            - artifact push workflow /tmp/tvos_build_number -d tvos_build_number
            - bundle exec fastlane next_version
            - export APP_VERSION=$(cat fastlane/.next_version)
            - test -n "$APP_VERSION"
            - echo "$APP_VERSION" > /tmp/tvos_app_version
            - artifact push workflow /tmp/tvos_app_version -d tvos_app_version
            - 'bundle exec fastlane beta build_number:$BUILD_NUMBER marketing_version:$APP_VERSION'
      secrets:
        - name: bccmedia-testflight-api
        - name: ios-signing-certs
        - name: tvos-ci
promotions:
  - name: Run UI tests
    pipeline_file: test.yml
  - name: Promote to App Store
    pipeline_file: promote-app-store.yml
